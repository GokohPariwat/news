<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องมือสร้างภาพข่าว (Vertical Layout)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Prompt for Thai characters -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- html2canvas for capturing the DOM as an image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: #f3f4f6; 
        }
        
        /* Custom CSS Grid for different number of images (1-10) */
        .photo-grid { 
            display: grid; 
            gap: 6px; 
            width: 100%;
            height: 100%;
            background-color: #fff;
            padding: 6px;
        }
        
        /* 1 Image */
        .photo-grid-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
        
        /* 2 Images (Vertical split) */
        .photo-grid-2 { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
        
        /* 3 Images */
        .photo-grid-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        .photo-grid-3 > div:first-child { grid-column: span 2; }
        
        /* 4 Images (1 Top Large, 3 Bottom Small - LIKE REFERENCE IMAGE) */
        .photo-grid-4 { grid-template-columns: repeat(3, 1fr); grid-template-rows: 1.8fr 1fr; }
        .photo-grid-4 > div:first-child { grid-column: span 3; }
        
        /* 5 Images (2 Top, 3 Bottom) */
        .photo-grid-5 { grid-template-columns: repeat(6, 1fr); grid-template-rows: 1fr 1fr; }
        .photo-grid-5 > div:nth-child(1), .photo-grid-5 > div:nth-child(2) { grid-column: span 3; }
        .photo-grid-5 > div:nth-child(n+3) { grid-column: span 2; }

        /* 6 Images (2x3) */
        .photo-grid-6 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); }
        
        /* 7-10 Images - Grid fallbacks */
        .photo-grid-7, .photo-grid-8 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(4, 1fr); }
        .photo-grid-9, .photo-grid-10 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(5, 1fr); }
        
        /* Shared image styling (อัปเดตใหม่ บังคับให้รูปไม่ล้นกรอบ) */
        .photo-grid > div {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
            background-color: #e5e7eb; /* พื้นหลังสีเทาอ่อนรองรับภาพ */
        }

        .photo-grid img { 
            position: absolute; /* บังคับให้รูปเกาะติดกรอบ */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* ค่าเริ่มต้นให้เต็มกรอบ */
            display: block; 
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Canvas absolute center helper */
        #scale-bounding-box {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* =========================================
           THEME & LAYOUT CSS VARIABLES
           ========================================= */
        .theme-bg { background-color: var(--theme-color) !important; }
        .theme-bg-dark { background-color: var(--theme-dark) !important; }
        .theme-text { color: var(--theme-color) !important; }
        .theme-stroke { stroke: var(--theme-color) !important; }

        /* --- LAYOUT: CLASSIC (Default) --- */
        #news-canvas[data-layout="classic"] #title-box { transform: rotate(-1deg); border-radius: 1rem; border-bottom-width: 6px; }
        #news-canvas[data-layout="classic"] #out-title { transform: rotate(1deg); }

        /* --- LAYOUT: MODERN --- */
        #news-canvas[data-layout="modern"] #section-header { align-items: flex-start; padding-left: 3rem; text-align: left; }
        #news-canvas[data-layout="modern"] #title-wrapper { text-align: left; }
        #news-canvas[data-layout="modern"] #title-box { transform: none; border-radius: 0 1rem 1rem 0; border-left: 12px solid var(--theme-dark); border-bottom: none; display: inline-block; padding-left: 2rem; padding-right: 3rem; }
        #news-canvas[data-layout="modern"] #out-title { transform: none; }
        #news-canvas[data-layout="modern"] #location-wrapper { display: flex; justify-content: flex-start; margin-top: 1.5rem; }
        #news-canvas[data-layout="modern"] #footer-svg { display: none; }
        #news-canvas[data-layout="modern"] #section-footer { background-color: white; border-top: 8px solid var(--theme-color); align-items: flex-start; padding-left: 4rem; padding-bottom: 2.5rem; }
        #news-canvas[data-layout="modern"] #wrap-details { text-align: left; align-items: flex-start; }
        #news-canvas[data-layout="modern"] #out-details-container { align-items: flex-start; }
        #news-canvas[data-layout="modern"] #bg-watermark { left: -50px; top: -50px; }

        /* --- LAYOUT: OVERLAY --- */
        #news-canvas[data-layout="overlay"] { background-color: #000; }
        #news-canvas[data-layout="overlay"] #section-header { position: absolute; top: 0; left: 0; width: 100%; background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%); z-index: 10; padding-top: 2.5rem; padding-bottom: 4rem; }
        #news-canvas[data-layout="overlay"] #title-box { background-color: transparent !important; border: none; padding: 0; transform: none; box-shadow: none; }
        #news-canvas[data-layout="overlay"] #out-title { transform: none; color: white !important; text-shadow: 2px 4px 10px rgba(0,0,0,0.8); }
        #news-canvas[data-layout="overlay"] #out-agency { color: white !important; text-shadow: 1px 2px 5px rgba(0,0,0,0.8); }
        #news-canvas[data-layout="overlay"] #location-box { background-color: var(--theme-color) !important; border: none; }
        #news-canvas[data-layout="overlay"] #footer-svg { display: none; }
        #news-canvas[data-layout="overlay"] #section-footer { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0) 100%); z-index: 10; min-height: auto; padding-bottom: 3rem; padding-top: 6rem; border: none; }
        #news-canvas[data-layout="overlay"] #out-details-container { color: white !important; text-shadow: 1px 2px 5px rgba(0,0,0,0.9); }
        #news-canvas[data-layout="overlay"] #footer-decor { display: none; }
        #news-canvas[data-layout="overlay"] #bg-watermark { display: none; }

        /* --- LAYOUT: MINIMAL --- */
        #news-canvas[data-layout="minimal"] #section-header { background-color: white; padding-top: 3rem; }
        #news-canvas[data-layout="minimal"] #title-box { background-color: white !important; border: 4px solid var(--theme-color); box-shadow: none; transform: none; border-radius: 999px; padding: 15px 50px; }
        #news-canvas[data-layout="minimal"] #out-title { transform: none; color: var(--theme-color) !important; text-shadow: none; }
        #news-canvas[data-layout="minimal"] #location-box { background-color: transparent !important; color: var(--theme-color) !important; border: 3px solid var(--theme-color); box-shadow: none; }
        #news-canvas[data-layout="minimal"] #footer-svg { display: none; }
        #news-canvas[data-layout="minimal"] #section-footer { background-color: white; border-top: 1px solid #e5e7eb; padding-bottom: 2.5rem; }
        #news-canvas[data-layout="minimal"] #bg-watermark { opacity: 0.08; mix-blend-mode: normal; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-gray-800">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 shadow-sm py-2 px-4 md:px-6 z-20 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-3">
            <div class="bg-green-600 text-white p-1.5 rounded-lg shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" />
                </svg>
            </div>
            <div>
                <h1 class="text-sm md:text-lg font-bold leading-tight">News Poster Layout</h1>
                <p class="text-[10px] md:text-xs text-gray-500 hidden sm:block">สร้างภาพข่าวแนวตั้ง สไตล์โปสเตอร์</p>
            </div>
        </div>
        <button id="btn-download" class="bg-green-600 hover:bg-green-700 text-white font-medium py-1.5 px-3 md:py-2 md:px-4 rounded-lg shadow-sm transition-colors flex items-center gap-2 text-xs md:text-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
            <span id="btn-text" class="hidden sm:inline">ดาวน์โหลดรูปภาพ</span>
            <span class="sm:hidden">โหลด</span>
        </button>
    </header>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative bg-gray-100">
        
        <!-- Preview Area (Canvas Container) - Moved to top on mobile -->
        <div class="order-1 flex-none h-[45%] md:h-full md:flex-1 bg-gray-200/80 overflow-hidden flex justify-center items-center p-2 sm:p-4 shadow-inner" id="scroll-wrapper">
            
            <div id="scale-bounding-box" class="w-full h-full relative">
                <!-- THE ACTUAL CANVAS TO CAPTURE: Portrait 4:5 Aspect Ratio (1080x1350) -->
                <div id="canvas-container" class="absolute origin-center transition-transform duration-200" style="width: 1080px; height: 1350px;">
                    
                    <div id="news-canvas" data-layout="classic" class="bg-white w-full h-full shadow-2xl flex flex-col relative overflow-hidden" style="--theme-color: #15803d; --theme-dark: #14532d;">
                        
                        <!-- Top Header Section (25%) -->
                        <div id="section-header" class="relative pt-12 pb-6 px-10 flex flex-col items-center z-10 shrink-0 transition-all duration-300 overflow-hidden">
                            
                            <!-- Watermark Background Logo (Moved here so it doesn't overflow to images) -->
                            <img id="bg-watermark" src="logo.png" class="absolute -top-[100px] -left-[100px] w-[800px] h-[800px] object-contain opacity-25 pointer-events-none mix-blend-multiply z-[1] transition-opacity" alt="" onerror="this.style.display='none'">

                            <!-- Subtle background graphics -->
                            <div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(circle at 50% 0%, var(--theme-color) 0%, transparent 60%);"></div>
                            
                            <!-- Agency & Logo Row -->
                            <div id="agency-wrapper" class="flex items-center gap-6 mb-6 relative z-10 w-full justify-center transition-all">
                                <!-- Logo Placeholder -->
                                <div id="logo-container" class="w-24 h-24 rounded-full bg-white border-4 flex items-center justify-center shadow-md overflow-hidden shrink-0 transition-colors" style="border-color: var(--theme-color);">
                                    <img id="logo-image" src="logo.png" alt="โลโก้หน่วยงาน" class="w-full h-full object-contain p-1" onerror="this.style.display='none'">
                                </div>
                                <h2 id="out-agency" class="text-[3.2rem] font-extrabold tracking-tight theme-text transition-all">
                                </h2>
                            </div>

                            <!-- Headline -->
                            <div id="title-wrapper" class="w-full flex justify-center relative z-10 transition-all">
                                <!-- กล่องพาดหัวข่าว -->
                                <div id="title-box" class="inline-block px-10 pt-5 pb-8 shadow-[0_8px_20px_rgba(0,0,0,0.15)] theme-bg border-black/20 transition-all duration-300">
                                    <h1 id="out-title" class="text-[4.5rem] font-black text-white leading-normal drop-shadow-md pb-4 transition-all duration-300">
                                    </h1>
                                </div>
                            </div>

                            <!-- Location Tag -->
                            <div id="location-wrapper" class="mt-8 relative z-10 w-full flex justify-center transition-all">
                                <div id="location-box" class="theme-bg-dark text-white px-8 py-3 rounded-full flex items-center gap-3 shadow-lg font-semibold text-2xl border-2 border-white transition-all duration-300">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-orange-400 shrink-0" viewBox="0 0 20 20" fill="currentColor">
                                        <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
                                    </svg>
                                    <span id="out-location"></span>
                                </div>
                            </div>
                        </div>

                        <!-- Middle Images Section (~60%) -->
                        <div id="section-images" class="flex-1 w-full bg-white relative z-0 flex flex-col justify-center transition-all duration-300">
                            <div id="out-images" class="hidden w-full h-full">
                                <!-- Images injected by JS -->
                            </div>
                            
                            <!-- Placeholder -->
                            <div id="empty-images" class="h-full w-full bg-gray-50 flex flex-col items-center justify-center text-gray-400 text-3xl font-medium gap-4 mx-4 mb-4 rounded-xl border-4 border-dashed border-gray-200">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                </svg>
                                <span>อัปโหลดรูปภาพ (แนะนำ 4 รูป)</span>
                            </div>
                        </div>

                        <!-- Bottom Footer Section (~15%) -->
                        <div id="section-footer" class="relative w-full shrink-0 min-h-[220px] bg-white flex flex-col justify-end pb-10 px-12 z-20 transition-all duration-300">
                            <!-- Decorative Top Border (Curves) -->
                            <div id="footer-svg" class="absolute top-0 left-0 w-full overflow-hidden -translate-y-[98%]">
                                <svg viewBox="0 0 1080 120" class="w-full h-[60px]" preserveAspectRatio="none">
                                    <path d="M0,120 C300,0 780,0 1080,120 Z" fill="white" />
                                    <path d="M0,120 C300,10 780,10 1080,120 Z" fill="none" class="theme-stroke" stroke-width="8" opacity="0.8"/>
                                    <path d="M0,120 C250,30 830,30 1080,120 Z" fill="none" stroke="#f97316" stroke-width="4" opacity="0.9"/>
                                </svg>
                            </div>
                            
                            <!-- Details Text -->
                            <div id="wrap-details" class="w-full text-center relative flex-1 flex flex-col items-center justify-center transition-opacity py-2">
                                <div id="out-details-container" class="flex flex-col items-center justify-center w-full theme-text transition-colors" style="font-size: 35px;">
                                    <p id="out-detail-1" class="font-black leading-tight mb-2 w-full text-center transition-all" style="font-size: 2.4em;"></p>
                                    <p id="out-detail-2" class="font-medium leading-tight mt-1 w-full text-center transition-all" style="font-size: 1em;"></p>
                                    <p id="out-detail-3" class="font-medium leading-tight mt-1 w-full text-center transition-all" style="font-size: 1em;"></p>
                                </div>
                            </div>
                            
                            <!-- Bottom Decorative line -->
                            <div id="footer-decor" class="absolute bottom-0 left-0 w-full h-3 theme-bg transition-colors"></div>
                        </div>
                        
                    </div>
                </div>
            </div>
        </div>

        <!-- Sidebar Controls -->
        <div class="order-2 flex-1 md:flex-none w-full md:w-[380px] lg:w-[420px] bg-white border-t md:border-t-0 md:border-l border-gray-200 overflow-y-auto p-4 md:p-6 flex flex-col gap-5 shadow-[0_-4px_15px_rgba(0,0,0,0.03)] md:shadow-[-4px_0_15px_rgba(0,0,0,0.03)] z-20 pb-10 md:pb-6">
            
            <h3 class="font-bold text-gray-800 text-lg border-b pb-2">ข้อมูลข่าว</h3>

            <!-- Logo Selection -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">เลือกโลโก้หน่วยงาน</label>
                <div class="flex bg-gray-200/60 p-1 rounded-lg">
                    <button id="logo-district" class="flex-1 py-1.5 text-xs sm:text-sm font-medium rounded-md bg-white shadow-sm text-green-700 transition-colors">สำนักงานเขต</button>
                    <button id="logo-bma" class="flex-1 py-1.5 text-xs sm:text-sm font-medium rounded-md text-gray-500 hover:text-gray-800 transition-colors">กทม.</button>
                </div>
            </div>

            <!-- Agency Input -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">ชื่อหน่วยงาน / องค์กร</label>
                <input type="text" id="in-agency" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition text-sm shadow-sm" placeholder="เช่น สำนักงานเขตพญาไท">
                
                <!-- Format Toolbar -->
                <div class="flex items-center justify-between mt-1 bg-gray-50/80 rounded px-2 py-1.5 border border-gray-200">
                    <div class="flex gap-1">
                        <button onclick="setTextAlign('agency-wrapper', 'left')" class="p-1 hover:bg-gray-200 rounded text-gray-600 transition-colors"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h10M4 18h16"/></svg></button>
                        <button onclick="setTextAlign('agency-wrapper', 'center')" class="p-1 hover:bg-gray-200 rounded text-gray-600 transition-colors"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M7 12h10M4 18h16"/></svg></button>
                        <button onclick="setTextAlign('agency-wrapper', 'right')" class="p-1 hover:bg-gray-200 rounded text-gray-600 transition-colors"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M10 12h10M4 18h16"/></svg></button>
                    </div>
                    <div class="flex gap-1">
                        <button onclick="changeFontSize('out-agency', -4)" class="px-2 py-0.5 hover:bg-gray-200 rounded text-gray-600 text-xs font-bold transition-colors">A-</button>
                        <button onclick="changeFontSize('out-agency', 4)" class="px-2 py-0.5 hover:bg-gray-200 rounded text-gray-600 text-xs font-bold transition-colors">A+</button>
                    </div>
                </div>
            </div>

            <!-- Headline Input -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">พาดหัวข่าว (Headline)</label>
                <textarea id="in-title" rows="2" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition text-sm shadow-sm" placeholder="พิมพ์พาดหัวข่าวที่นี่..."></textarea>
                
                <!-- Format Toolbar -->
                <div class="flex items-center justify-between mt-1 bg-gray-50/80 rounded px-2 py-1.5 border border-gray-200">
                    <div class="flex gap-1">
                        <button onclick="setTextAlign('title-wrapper', 'left')" class="p-1 hover:bg-gray-200 rounded text-gray-600 transition-colors"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h10M4 18h16"/></svg></button>
                        <button onclick="setTextAlign('title-wrapper', 'center')" class="p-1 hover:bg-gray-200 rounded text-gray-600 transition-colors"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M7 12h10M4 18h16"/></svg></button>
                        <button onclick="setTextAlign('title-wrapper', 'right')" class="p-1 hover:bg-gray-200 rounded text-gray-600 transition-colors"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M10 12h10M4 18h16"/></svg></button>
                    </div>
                    <div class="flex gap-1">
                        <button onclick="changeFontSize('out-title', -6)" class="px-2 py-0.5 hover:bg-gray-200 rounded text-gray-600 text-xs font-bold transition-colors">A-</button>
                        <button onclick="changeFontSize('out-title', 6)" class="px-2 py-0.5 hover:bg-gray-200 rounded text-gray-600 text-xs font-bold transition-colors">A+</button>
                    </div>
                </div>
            </div>
            
            <!-- Location Input -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">สถานที่ (Location Tag)</label>
                <input type="text" id="in-location" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition text-sm shadow-sm" placeholder="เช่น ถนนพหลโยธิน • ซอยพหลโยธิน 4">
                
                <!-- Format Toolbar -->
                <div class="flex items-center justify-between mt-1 bg-gray-50/80 rounded px-2 py-1.5 border border-gray-200">
                    <div class="flex gap-1">
                        <button onclick="setTextAlign('location-wrapper', 'left')" class="p-1 hover:bg-gray-200 rounded text-gray-600 transition-colors"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h10M4 18h16"/></svg></button>
                        <button onclick="setTextAlign('location-wrapper', 'center')" class="p-1 hover:bg-gray-200 rounded text-gray-600 transition-colors"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M7 12h10M4 18h16"/></svg></button>
                        <button onclick="setTextAlign('location-wrapper', 'right')" class="p-1 hover:bg-gray-200 rounded text-gray-600 transition-colors"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M10 12h10M4 18h16"/></svg></button>
                    </div>
                    <div class="flex gap-1">

                            <button onclick="setTextAlign('out-detail-3', 'center')" class="p-1 hover:bg-gray-200 rounded text-gray-600"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M4 6h16M7 12h10M4 18h16"/></svg></button>
                            <button onclick="setTextAlign('out-detail-3', 'right')" class="p-1 hover:bg-gray-200 rounded text-gray-600"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M4 6h16M10 12h10M4 18h16"/></svg></button>

                    <button onclick="setNewsLayout('classic', this)" class="layout-btn active border-2 border-green-600 bg-green-50 text-green-700 py-2 rounded-lg text-xs font-bold transition-all">Classic<br><span class="font-normal text-[10px]">ดั้งเดิม โค้งมน</span></button>
                    <button onclick="setNewsLayout('modern', this)" class="layout-btn border-2 border-transparent bg-gray-100 text-gray-600 hover:bg-gray-200 py-2 rounded-lg text-xs font-bold transition-all">Modern<br><span class="font-normal text-[10px]">เหลี่ยม ทันสมัย</span></button>
                    <button onclick="setNewsLayout('overlay', this)" class="layout-btn border-2 border-transparent bg-gray-100 text-gray-600 hover:bg-gray-200 py-2 rounded-lg text-xs font-bold transition-all">Overlay<br><span class="font-normal text-[10px]">ภาพเต็มจอ ทับอักษร</span></button>
                    <button onclick="setNewsLayout('minimal', this)" class="layout-btn border-2 border-transparent bg-gray-100 text-gray-600 hover:bg-gray-200 py-2 rounded-lg text-xs font-bold transition-all">Minimal<br><span class="font-normal text-[10px]">คลีนๆ พื้นฐานขาว</span></button>
                </div>

            <!-- Theme Settings -->
            <div class="mt-4">
                <label class="block text-sm font-semibold text-gray-800 mb-2">สีธีมหลัก</label>
                <div class="flex flex-wrap gap-3" id="theme-colors">
                    <!-- Themes generated by JS -->
                </div>
            </div>
            
            <div class="mt-4 pt-4 border-t pb-10 md:pb-2">
                <button id="btn-clear" class="w-full py-2.5 px-4 bg-white border border-gray-300 hover:bg-red-50 hover:text-red-600 hover:border-red-300 text-gray-700 rounded-lg text-sm font-medium transition-colors shadow-sm">
                    ล้างข้อมูลทั้งหมด
                </button>

    </div>

    <script>
        // State
        let imageUrls = [];
        let imageFitMode = 'contain'; // 'contain' or 'cover'

        // Theme Configurations
        const themes = [
            { id: 'green', hex: '#15803d', dark: '#14532d' }, // Green (Default)
            { id: 'blue', hex: '#1d4ed8', dark: '#1e3a8a' },  // Blue
            { id: 'red', hex: '#b91c1c', dark: '#7f1d1d' },   // Red
            { id: 'orange', hex: '#ea580c', dark: '#9a3412' },// Orange
            { id: 'purple', hex: '#7e22ce', dark: '#581c87' },// Purple
            { id: 'pink', hex: '#db2777', dark: '#be185d' },  // Pink
            { id: 'teal', hex: '#0f766e', dark: '#115e59' },  // Teal
            { id: 'indigo', hex: '#4338ca', dark: '#3730a3' },// Indigo
            { id: 'yellow', hex: '#ca8a04', dark: '#a16207' },// Yellow
            { id: 'gray', hex: '#4b5563', dark: '#374151' }   // Gray
        ];
        let currentTheme = themes[0];

        // Setup Themes UI
        function setupThemes() {
            const container = document.getElementById('theme-colors');
            container.innerHTML = '';
            
            themes.forEach(theme => {
                const btn = document.createElement('button');
                btn.className = 'w-8 h-8 rounded-full shadow-sm border-2 transition-transform hover:scale-110 focus:outline-none';
                btn.style.backgroundColor = theme.hex;
                btn.style.borderColor = currentTheme.id === theme.id ? '#111827' : 'transparent';
                if(currentTheme.id === theme.id) btn.classList.add('scale-110');
                
                btn.onclick = () => applyTheme(theme, btn);
                container.appendChild(btn);
            });
        }

        // Apply chosen theme colors via CSS Variables
        function applyTheme(theme, activeBtn) {
            currentTheme = theme;
            
            const canvas = document.getElementById('news-canvas');
            canvas.style.setProperty('--theme-color', theme.hex);
            canvas.style.setProperty('--theme-dark', theme.dark);
            
            // Border color for logo (if needed explicitly)
            const logo = document.getElementById('logo-container');
            if(logo) logo.style.borderColor = theme.hex;
            
            // Update UI buttons
            const buttons = document.querySelectorAll('#theme-colors button');
            buttons.forEach(b => {
                b.style.borderColor = 'transparent';
                b.classList.remove('scale-110');
            });
            activeBtn.style.borderColor = '#111827';
            activeBtn.classList.add('scale-110');
        }

        // Layout Switcher Function
        function setNewsLayout(layoutName, activeBtn) {
            const canvas = document.getElementById('news-canvas');
            canvas.setAttribute('data-layout', layoutName);

            // Update UI Buttons
            const buttons = document.querySelectorAll('.layout-btn');
            buttons.forEach(btn => {
                btn.className = 'layout-btn border-2 border-transparent bg-gray-100 text-gray-600 hover:bg-gray-200 py-2 rounded-lg text-xs font-bold transition-all';
            });
            
            // Set active styles
            activeBtn.className = `layout-btn active border-2 border-[${currentTheme.hex}] bg-gray-50 py-2 rounded-lg text-xs font-bold transition-all shadow-sm`;
            activeBtn.style.borderColor = currentTheme.hex;
            activeBtn.style.color = currentTheme.hex;
        }

        // Setup Event Listeners for Text Inputs
        function bindInputs() {
            const fields = [
                { in: 'in-agency', out: 'out-agency', wrap: 'out-agency' },
                { in: 'in-title', out: 'out-title', wrap: 'title-wrapper' },
                { in: 'in-location', out: 'out-location', wrap: 'location-wrapper' },
                { in: 'in-detail-1', out: 'out-detail-1', wrap: 'wrap-details' },
                { in: 'in-detail-2', out: 'out-detail-2', wrap: 'wrap-details' },
                { in: 'in-detail-3', out: 'out-detail-3', wrap: 'wrap-details' },
            ];

            fields.forEach(f => {
                const inputEl = document.getElementById(f.in);
                inputEl.addEventListener('input', (e) => {
                    const val = e.target.value;
                    const outEl = document.getElementById(f.out);
                    
                    if (val.trim()) {
                        outEl.textContent = val;
                        outEl.style.display = 'block'; // แสดงผลบรรทัดที่มีข้อความ
                    } else {
                        outEl.textContent = '';
                        outEl.style.display = 'none'; // ซ่อนบรรทัดที่ว่างไว้เพื่อให้ระยะช่องไฟสวยงาม
                    }
                    
                    // จัดการการแสดงผลของกรอบครอบ (Wrapper)
                    if (f.wrap === 'wrap-details') {
                        const d1 = document.getElementById('in-detail-1').value.trim();
                        const d2 = document.getElementById('in-detail-2').value.trim();
                        const d3 = document.getElementById('in-detail-3').value.trim();
                        document.getElementById('wrap-details').style.opacity = (d1 || d2 || d3) ? '1' : '0';
                    } else {
                        const wrapEl = document.getElementById(f.wrap);
                        if(wrapEl && wrapEl !== outEl) wrapEl.style.opacity = val.trim() ? '1' : '0';
                    }
                    
                    // Trigger auto adjust
                    setTimeout(autoAdjustText, 50);
                });
            });
        }

        // Auto-adjust font size to fit container
        function autoAdjustText() {
            // 1. Title Adjust
            const titleEl = document.getElementById('out-title');
            const titleWrap = document.getElementById('title-wrapper');
            
            // Only auto-adjust if the user hasn't manually changed the size
            if (titleEl.textContent.trim() && titleEl.dataset.manualSize !== "true") {
                titleEl.style.fontSize = '4.5rem'; 
                let size = 72; // px approx for 4.5rem
                
                // Max width allowed is roughly 900px
                while (titleEl.offsetWidth > 900 && size > 24) {
                    size -= 2;
                    titleEl.style.fontSize = size + 'px';
                }
            }

            // 2. Details Adjust
            const detailsContainer = document.getElementById('out-details-container');
            const detailsWrap = document.getElementById('wrap-details');
            const d1 = document.getElementById('in-detail-1').value.trim();
            const d2 = document.getElementById('in-detail-2').value.trim();
            const d3 = document.getElementById('in-detail-3').value.trim();
            
            if ((d1 || d2 || d3) && detailsWrap && detailsContainer.dataset.manualSize !== "true") {
                let size = 35; // base font size
                detailsContainer.style.fontSize = size + 'px';
                
                // Keep shrinking while it overflows height of footer text area or width
                while ((detailsWrap.scrollHeight > detailsWrap.clientHeight || detailsContainer.offsetWidth > detailsWrap.clientWidth - 40) && size > 16) {
                    size -= 1;
                    detailsContainer.style.fontSize = size + 'px';
                }
            }
        }

        // --- NEW: Text Alignment Function ---
        function setTextAlign(targetId, align) {
            const el = document.getElementById(targetId);
            if(!el) return;
            
            // Convert 'left', 'center', 'right' to flex alignment
            let justify = 'center';
            if(align === 'left') justify = 'flex-start';
            if(align === 'right') justify = 'flex-end';

            // For wrappers using Flexbox (Agency, Title, Location)
            if(['agency-wrapper', 'location-wrapper', 'title-wrapper'].includes(targetId)) {
                el.style.justifyContent = justify;
                el.style.textAlign = align;
            } 
            // For block text (Details lines)
            else if (targetId.startsWith('out-detail')) {
                el.style.textAlign = align;
            }
        }

        // --- NEW: Font Size Adjustment Function ---
        function changeFontSize(targetId, delta) {
            const el = document.getElementById(targetId);
            if(!el) return;
            
            // Mark element so autoAdjustText doesn't reset it
            el.dataset.manualSize = "true";
            if(targetId.startsWith('out-detail')) {
                // If adjusting a detail line, stop container auto-adjust too
                document.getElementById('out-details-container').dataset.manualSize = "true";
            }

            // Get current computed font-size in pixels
            const style = window.getComputedStyle(el, null).getPropertyValue('font-size');
            let currentSize = parseFloat(style);
            
            // Apply new size
            el.style.fontSize = (currentSize + delta) + 'px';
        }

        // Handle Image Uploads with Auto-Resize
        document.getElementById('in-images').addEventListener('change', async (e) => {
            const files = e.target.files;
            if (!files || files.length === 0) return;
            
            // จำกัดจำนวนรูปสูงสุด 10 รูป
            const filesToProcess = Array.from(files).slice(0, 10);
            
            // ลบ URL เดิมออกจาก Memory
            imageUrls.forEach(url => URL.revokeObjectURL(url));
            imageUrls = [];
            
            // นำภาพไปปรับขนาดและเก็บ URL ใหม่
            for (const file of filesToProcess) {
                try {
                    const url = await resizeImage(file);
                    imageUrls.push(url);
                } catch(err) {
                    console.error("Error processing image", err);
                }
            }
            
            renderImages();
        });

        // ฟังก์ชันบีบอัดและปรับขนาดรูปภาพอัตโนมัติ
        function resizeImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const MAX_WIDTH = 1500;
                        const MAX_HEIGHT = 1500;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        canvas.toBlob((blob) => {
                            resolve(URL.createObjectURL(blob));
                        }, file.type, 0.85); // บีบอัดคุณภาพรูปภาพเล็กน้อยเพื่อให้ทำงานได้ไวขึ้น
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // Render Image Grid
        function renderImages() {
            const container = document.getElementById('out-images');
            const emptyState = document.getElementById('empty-images');
            container.innerHTML = '';
            
            const len = imageUrls.length;
            if (len === 0) {
                container.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }
            
            container.classList.remove('hidden');
            emptyState.classList.add('hidden');
            
            // Apply appropriate grid class
            container.className = `photo-grid photo-grid-${len} w-full h-full relative z-10`;
            
            imageUrls.forEach(src => {
                const div = document.createElement('div');
                const img = document.createElement('img');
                img.src = src;
                img.onerror = function() {
                    this.src = `https://placehold.co/800x600/e5e7eb/a3a8b8?text=Error`;
                };
                
                // กำหนดโหมดการจัดวางรูปล่าสุด และจัดให้อยู่ตรงกลางเสมอ
                img.style.objectFit = imageFitMode;
                img.style.objectPosition = 'center'; 
                
                div.appendChild(img);
                container.appendChild(div);
            });
        }

        // Scale Canvas for Responsiveness (Fixing 4:5 view)
        function resizeCanvas() {
            const wrapper = document.getElementById('scroll-wrapper');
            const canvasContainer = document.getElementById('canvas-container');
            const boundingBox = document.getElementById('scale-bounding-box');
            
            const targetWidth = 1080; 
            const targetHeight = 1350; 
            
            // Calculate available space
            const availableWidth = wrapper.clientWidth - 16; 
            const availableHeight = wrapper.clientHeight - 16;
            
            // Calculate scale to fit perfectly
            const scale = Math.min(availableWidth / targetWidth, availableHeight / targetHeight, 1);
            
            // Apply scale using CSS transform center
            canvasContainer.style.transform = `translate(-50%, -50%) scale(${scale})`;
            canvasContainer.style.left = '50%';
            canvasContainer.style.top = '50%';
        }

        // Download functionality
        document.getElementById('btn-download').addEventListener('click', async () => {
            const btn = document.getElementById('btn-download');
            const btnText = document.getElementById('btn-text');
            const originalText = btnText.innerText;
            
            btnText.innerText = 'กำลังประมวลผล...';
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            const canvasContainer = document.getElementById('canvas-container');
            const targetElement = document.getElementById('news-canvas');
            
            // Remove scale temporarily for sharp capture
            const currentTransform = canvasContainer.style.transform;
            canvasContainer.style.transform = 'translate(-50%, -50%) scale(1)';

            try {
                await new Promise(r => setTimeout(r, 150)); 

                const canvas = await html2canvas(targetElement, {
                    scale: 2, 
                    useCORS: true,
                    backgroundColor: '#ffffff',
                    logging: false,
                    windowWidth: 1080,
                    windowHeight: 1350
                });
                
                const link = document.createElement('a');
                link.download = `news-poster-${new Date().getTime()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                
            } catch (error) {
                console.error("Error generating image:", error);
                alert("เกิดข้อผิดพลาดในการสร้างรูปภาพ");
            } finally {
                canvasContainer.style.transform = currentTransform;
                btnText.innerText = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        });

        // Reset
        document.getElementById('btn-clear').addEventListener('click', () => {
            if(confirm('ยืนยันการล้างข้อมูลทั้งหมด?')) {
                document.getElementById('in-agency').value = '';
                document.getElementById('in-title').value = '';
                document.getElementById('in-location').value = '';
                document.getElementById('in-detail-1').value = '';
                document.getElementById('in-detail-2').value = '';
                document.getElementById('in-detail-3').value = '';
                
                imageUrls.forEach(url => URL.revokeObjectURL(url));
                imageUrls = [];
                renderImages();
                
                ['in-agency', 'in-title', 'in-location', 'in-detail-1', 'in-detail-2', 'in-detail-3'].forEach(id => {
                    document.getElementById(id).dispatchEvent(new Event('input'));
                });
            }
        });

        // Initialize
        window.addEventListener('load', () => {
            setupThemes();
            bindInputs();
            
            // Image Fit Listeners
            document.getElementById('fit-contain').addEventListener('click', () => setFitMode('contain'));
            document.getElementById('fit-cover').addEventListener('click', () => setFitMode('cover'));

            // Logo Selection Listeners
            document.getElementById('logo-bma').addEventListener('click', () => setLogoMode('bma'));
            document.getElementById('logo-district').addEventListener('click', () => setLogoMode('district'));

            // บังคับให้โหลดเริ่มต้นเป็นโหมด "เต็มกรอบ" เพื่อให้ภาพพอดีกับช่องเสมอ
            setFitMode('cover');

            // Trigger empty inputs to hide placeholders initially
            ['in-agency', 'in-title', 'in-location', 'in-detail-1', 'in-detail-2', 'in-detail-3'].forEach(id => {
                document.getElementById(id).dispatchEvent(new Event('input'));
            });

            window.addEventListener('resize', resizeCanvas);
            setTimeout(resizeCanvas, 100);
        });

        // ฟังก์ชันสลับโหมดรูปภาพ
        function setFitMode(mode) {
            imageFitMode = mode;
            const btnContain = document.getElementById('fit-contain');
            const btnCover = document.getElementById('fit-cover');
            const helperText = document.getElementById('fit-helper-text');
            
            // อัปเดตสไตล์ของปุ่ม (UI Toggle)
            if (mode === 'contain') {
                btnContain.className = 'flex-1 py-1.5 text-xs sm:text-sm font-medium rounded-md bg-white shadow-sm text-green-700 transition-colors';
                btnCover.className = 'flex-1 py-1.5 text-xs sm:text-sm font-medium rounded-md text-gray-500 hover:text-gray-800 transition-colors';
                helperText.innerText = 'ภาพจะแสดงครบทุกส่วน แต่อาจมีขอบสีเทาถ้าสัดส่วนไม่พอดีช่อง';
            } else {
                btnCover.className = 'flex-1 py-1.5 text-xs sm:text-sm font-medium rounded-md bg-white shadow-sm text-green-700 transition-colors';
                btnContain.className = 'flex-1 py-1.5 text-xs sm:text-sm font-medium rounded-md text-gray-500 hover:text-gray-800 transition-colors';
                helperText.innerText = 'ภาพจะขยายเติมเต็มช่องว่าง (อาจมีบางส่วนของภาพถูกตัดออกไป)';
            }
            
            // อัปเดตรูปภาพทั้งหมดที่แสดงอยู่บนหน้าจอทันที
            const images = document.querySelectorAll('.photo-grid img');
            images.forEach(img => {
                img.style.objectFit = mode;
            });
        }

        // ฟังก์ชันสลับโลโก้
        function setLogoMode(mode) {
            const img = document.getElementById('logo-image');
            const watermark = document.getElementById('bg-watermark');
            const btnBma = document.getElementById('logo-bma');
            const btnDistrict = document.getElementById('logo-district');
            
            if (mode === 'bma') {
                img.src = 'logo1.png';
                if(watermark) watermark.src = 'logo1.png';
                img.style.display = 'block'; // เผื่อกรณีที่เคย error แล้วซ่อนไป
                btnBma.className = 'flex-1 py-1.5 text-xs sm:text-sm font-medium rounded-md bg-white shadow-sm text-green-700 transition-colors';
                btnDistrict.className = 'flex-1 py-1.5 text-xs sm:text-sm font-medium rounded-md text-gray-500 hover:text-gray-800 transition-colors';
            } else {
                img.src = 'logo.png';
                if(watermark) watermark.src = 'logo.png';
                img.style.display = 'block';
                btnDistrict.className = 'flex-1 py-1.5 text-xs sm:text-sm font-medium rounded-md bg-white shadow-sm text-green-700 transition-colors';
                btnBma.className = 'flex-1 py-1.5 text-xs sm:text-sm font-medium rounded-md text-gray-500 hover:text-gray-800 transition-colors';
            }
        }
    </script>
</body>
</html>
